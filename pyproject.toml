[project]
name = "wbm"
version = "0.3.1"
description = "Western Blot Matome - western blot figure assembly tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "tifffile>=2024.8",
    "opencv-python-headless>=4.10",
    "openpyxl>=3.1",
    "pydantic>=2.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-pptx>=1.0.2",
    "pillow>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/Yokohide0317/western_blot_matome"
Releases = "https://github.com/Yokohide0317/western_blot_matome/releases"

[project.scripts]
wbm = "wb.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "playwright>=1.64.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
