<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Western Blot Matome (WBM)</title>
<link rel="icon" href="icon.png">
<style>
  :root { --teal: #0b6b5f; --border: #d9e1e3; --muted: #6d7f87; --text: #193238; --bg: #f4f6f6; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; color: var(--text); background: var(--bg); }
  header { display: flex; align-items: baseline; gap: 10px; padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--border); }
  header b { color: var(--teal); font-size: 16px; }
  header span { color: var(--muted); font-size: 12px; }
  main { max-width: 880px; margin: 24px auto 48px; padding: 0 16px; display: grid; gap: 20px; }
  h2 { margin: 0 0 8px; font-size: 13px; color: #52666f; font-weight: 600; }
  .open { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button.big { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 14px 16px; text-align: left;
    font: inherit; color: var(--text); background: #fff; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; }
  button.big:hover:not(:disabled) { border-color: #9fc7c0; background: #f7fbfa; }
  button.big b { color: var(--teal); font-size: 15px; }
  button.big small { color: var(--muted); }
  button:disabled { opacity: .55; cursor: wait; }
  .drop { margin-top: 12px; padding: 18px; text-align: center; color: var(--muted); border: 1.5px dashed #b9c8cc; border-radius: 10px; background: #fff; }
  .drop.over { border-color: var(--teal); background: #eef7f5; color: var(--teal); }
  .status { min-height: 20px; font-size: 13px; color: var(--teal); }
  .status.error { color: #b4553a; }
  ul { list-style: none; margin: 0; padding: 0; background: #fff; border: 1px solid var(--border); border-radius: 10px; }
  li { display: grid; grid-template-columns: 1fr auto auto; gap: 0 12px; align-items: center; padding: 10px 14px; border-top: 1px solid #eef2f2; }
  li:first-child { border-top: 0; }
  li a { color: var(--teal); font-weight: 600; text-decoration: none; }
  li a:hover { text-decoration: underline; }
  li .path { grid-column: 1; color: var(--muted); font-size: 12px; word-break: break-all; }
  li time { grid-row: 1; grid-column: 2; font-size: 12px; color: var(--muted); white-space: nowrap; }
  li .forget { grid-row: 1 / 3; grid-column: 3; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: #8a98a0; cursor: pointer; font-size: 16px; }
  li .forget:hover { background: #f1e7e4; color: #b4553a; }
  li.missing .name { color: #8a98a0; }
  li.missing .path::after { content: "　見つかりません"; color: #b4553a; }
  .empty { padding: 14px; color: var(--muted); }
  footer { font-size: 12px; color: var(--muted); line-height: 1.7; border-top: 1px solid var(--border); padding-top: 12px; }
  footer a { color: var(--teal); }
  .update { position: fixed; right: 16px; bottom: 16px; z-index: 10; width: min(400px, calc(100vw - 32px)); padding: 14px 16px;
    background: #fff; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 6px 24px rgba(0, 0, 0, .12); }
  .update p { margin: 0 0 8px; }
  .update .title { font-weight: 600; color: var(--teal); }
  .update .error { color: #b4553a; }
  .update code { display: block; margin-bottom: 8px; padding: 6px 8px; font-size: 12px; background: var(--bg); border-radius: 6px; word-break: break-all; user-select: all; }
  .update .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .update button { font: inherit; padding: 5px 14px; border: 1px solid var(--border); border-radius: 6px; background: #fff; color: var(--text); cursor: pointer; }
  .update button.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
  @media (max-width: 560px) { .open { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><b>WBM</b><span>Western Blot Matome</span></header>
<main>
  <section aria-label="開く">
    <h2>開く</h2>
    <div class="open">
      <button class="big" type="button" data-kind="file" aria-label="ファイルを開く">
        <b>ファイルを開く</b><small>.zip or .wblot</small>
      </button>
      <button class="big" type="button" data-kind="folder" aria-label="フォルダを開く">
        <b>フォルダを開く</b><small>ChemiDocの画像フォルダ。結果はそのフォルダに保存します。</small>
      </button>
    </div>
    <div class="drop" id="drop">ZIPをここにドロップ（「書類 › western_blot_matome」に保存します）</div>
    <p class="status" id="status" role="status"></p>
  </section>
  <section aria-label="最近開いたプロジェクト">
    <h2>最近開いたプロジェクト</h2>
    <ul id="recent"><li class="empty">読み込み中…</li></ul>
  </section>
  <footer>
    このツールは手元のPC上で動き、画像やデータを外部のサーバーに保存しません。ただし、AIエージェントと一緒に使うと、画像や会話の内容がAIの提供元へ送信され、設定によっては保存される場合があります。各提供元のポリシーを確認のうえ、ご自身の責任でご利用ください。リポジトリの管理者およびコントリビューターは、利用によって生じた損害について責任を負いません。
    <a href="https://github.com/Yokohide0317/western_blot_matome#利用上の注意" target="_blank" rel="noopener">詳しく</a>
  </footer>
</main>
<div class="update" id="update" role="dialog" aria-label="更新のお知らせ" hidden></div>
<script>
  const status = document.getElementById('status');
  const buttons = [...document.querySelectorAll('button.big')];
  const say = (text, error = false) => { status.textContent = text; status.classList.toggle('error', error); };
  const busy = on => buttons.forEach(b => b.disabled = on);
  const esc = text => String(text).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

  async function post(path, body, headers = {'Content-Type': 'application/json'}) {
    const response = await fetch(path, {method: 'POST', headers, body});
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || '開けませんでした');
    return data;
  }
  async function opened(task, waiting) {
    busy(true);
    say(waiting);
    try {
      const result = await task();
      if (result.cancelled) { say(''); return; }
      say(result.created ? '取り込みました。開いています…' : '開いています…');
      location.href = result.url;
    } catch (error) {
      say(error.message, true);
    } finally {
      busy(false);
    }
  }
  buttons.forEach(button => button.addEventListener('click', () => opened(
    () => post('api/hub/open', JSON.stringify({kind: button.dataset.kind})),
    '選択ダイアログを表示しています。初めてのデータは取り込みと初期提案に数十秒かかります。')));

  const drop = document.getElementById('drop');
  ['dragenter', 'dragover'].forEach(type => drop.addEventListener(type, event => { event.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(type => drop.addEventListener(type, () => drop.classList.remove('over')));
  drop.addEventListener('drop', event => {
    event.preventDefault();
    const file = event.dataTransfer.files[0];
    if (!file) return;
    if (!file.name.toLowerCase().endsWith('.zip')) { say('ドロップできるのはZIPだけです', true); return; }
    opened(() => post('api/hub/upload?name=' + encodeURIComponent(file.name), file, {'Content-Type': 'application/zip'}),
      `${file.name} を保存して取り込んでいます…`);
  });

  async function loadRecent() {
    const list = document.getElementById('recent');
    const entries = await (await fetch('api/hub/projects')).json();
    list.innerHTML = entries.length ? entries.map(e => `
      <li class="${e.exists ? '' : 'missing'}" data-id="${esc(e.id)}">
        ${e.exists ? `<a class="name" href="p/${esc(e.id)}/">${esc(e.name)}</a>` : `<span class="name">${esc(e.name)}</span>`}
        <time>${esc(e.last_opened_local)}</time>
        <button class="forget" type="button" title="一覧から外す（ファイルは消しません）" aria-label="${esc(e.name)} を一覧から外す">×</button>
        <span class="path">${esc(e.path)}</span>
      </li>`).join('') : '<li class="empty">まだ開いたプロジェクトはありません。</li>';
    list.querySelectorAll('.forget').forEach(button => button.addEventListener('click', async () => {
      await post('api/hub/forget', JSON.stringify({id: button.closest('li').dataset.id}));
      loadRecent();
    }));
  }
  loadRecent().catch(() => say('一覧を読み込めませんでした', true));

  // Update notice: shown when GitHub has a newer release; 「あとで」 hides that version for good.
  const DISMISSED = 'wbm.update.dismissed';
  const dismissed = () => { try { return localStorage.getItem(DISMISSED); } catch { return null; } };
  const dismiss = version => { try { localStorage.setItem(DISMISSED, version); } catch { /* ask again next time */ } };
  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

  function showUpdate(info, {updating = false, error = ''} = {}) {
    const box = document.getElementById('update');
    box.hidden = false;
    box.innerHTML = `<p class="title">新しいバージョン v${esc(info.latest)} があります（現在 v${esc(info.current)}）</p>` + (updating
      ? '<p>更新中…（1分ほどかかります）</p>'
      : (info.can_apply ? '' : `<p>${esc(info.reason)}</p><code>${esc(info.command)}</code>`)
        + (error ? `<p class="error">${esc(error)}</p>` : '')
        + '<div class="actions">'
        + (info.can_apply && !error ? '<button class="primary" type="button" data-act="apply">更新する</button>' : '')
        + '<button type="button" data-act="later">あとで</button></div>');
    box.querySelector('[data-act="later"]')?.addEventListener('click', () => { dismiss(info.latest); box.hidden = true; });
    box.querySelector('[data-act="apply"]')?.addEventListener('click', () => applyUpdate(info));
  }

  async function applyUpdate(info) {
    showUpdate(info, {updating: true});
    try {
      const response = await fetch('api/hub/update', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'});
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.detail || '更新を始められませんでした');
    } catch (error) {
      showUpdate(info, {error: error.message});
      return;
    }
    const deadline = Date.now() + 3 * 60 * 1000;
    while (Date.now() < deadline) {
      await sleep(2000);
      try {
        const hub = await (await fetch('api/hub', {cache: 'no-store'})).json();
        if (hub.version === info.latest) { location.reload(); return; }
      } catch { /* the server is restarting */ }
    }
    showUpdate(info, {error: `更新を確認できませんでした。しばらくしてからページを再読み込みしてください（記録: ${info.log}）`});
  }

  fetch('api/hub/update').then(response => response.ok ? response.json() : null).then(info => {
    if (info && info.available && info.latest && info.latest !== dismissed()) showUpdate(info);
  }).catch(() => {});
</script>
</body>
</html>
