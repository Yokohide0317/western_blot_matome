name: release

# Push a tag like v0.2.0 (matching pyproject.toml) to publish a GitHub Release
# with the wheel and the one-line installers.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the web UI
        working-directory: src/wb/web/app
        run: |
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@v5
      - name: Check the tag matches the package version
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - run: uv build -o dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* install.sh install.ps1 --title "$GITHUB_REF_NAME" --generate-notes
